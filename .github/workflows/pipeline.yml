name: Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  app:
    uses: Brent-Tunnicliff/workflow-common-apple/.github/workflows/common.yml@wip
    strategy:
      matrix:
        platform: ["iOS", "macOS", "tvOS", "visionOS"]
    with:
      platform: "${{ matrix.platform }}"
      scheme: "App"
      skip_tests: false
